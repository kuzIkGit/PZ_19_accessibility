<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Доступная библиотека</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header class="header">
      <p>Библиотека</p>
      <nav><a href="#books">Книги</a><a href="#about">О проекте</a></nav>
    </header>
    <main>
      <section class="hero">
        <img src="./images/book.svg" class="hero__image" alt="book.svg" />
        <label>
          <p>Учебная библиотека</p>
          <h1>Книги для самостоятельного обучения</h1>
          <p>
            Проверьте страницу с точки зрения клавиатурной навигации и
            скринридера.
          </p>
          <a class="hero__button" href="#books">Открыть каталог</a>
        </label>
      </section>
      <section id="books">
        <h2>Популярные книги</h2>
        <article class="book">
          <img src="./images/book.svg" alt="Обложка книги «Основы веб-разработки»" />
          <h3>Основы веб-разработки</h3>
          <p>Введение в HTML и CSS.</p>
          <a href="#" aria-label="Подробнее о книге «Основы веб-разработки»">Подробнее</a>
        </article>
      </section>
      <section id="about"><h2>О проекте</h2></section>
    </main>
  </body>
</html>
